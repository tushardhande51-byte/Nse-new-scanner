name: Manual Fundamental Scorer Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scorer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run sample scoring test
        run: python fundamental_score_test.py
