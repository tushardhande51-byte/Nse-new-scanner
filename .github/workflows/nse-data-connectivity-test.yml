name: Manual NSE Data Connectivity Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nse-connectivity-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install "requests>=2.31,<3"
      - name: Test official NSE endpoints
        run: python nse_data_test.py
