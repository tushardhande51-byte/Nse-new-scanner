name: NIFTY Options Scanner

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes during Indian market hours, Mon-Fri.
    - cron: "*/15 3-10 * * 1-5"

jobs:
  options-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NIFTY options scanner
        env:
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
        run: python options_scanner.py
